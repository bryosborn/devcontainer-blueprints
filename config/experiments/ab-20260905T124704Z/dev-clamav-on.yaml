# yaml-language-server: $schema=../../wolfi.schema.json
# Isolated A/B measurement; changes one capability relative to this profile default.
# ClamAV-on is an experiment, not an approved release; raw scan failures are retained.
schemaVersion: 2
image:
  reference: devcontainer-blueprints/wolfi-ab-dev-clamav-on:20260905t124704z-amd64
  platform: linux/amd64
artifacts:
  root: artifacts/wolfi/ab-20260905T124704Z/dev-clamav-on
wolfi:
  baseImage: cgr.dev/chainguard/wolfi-base:latest
  repositories:
    main: https://apk.cgr.dev/chainguard
    extra: https://apk.cgr.dev/extra-packages
user:
  name: vscode
  uid: 1000
  gid: 1000
devcontainer: true
docker:
  cli: latest
  buildx: latest
  compose: latest
  socket: true
vscode:
  version: 1.136.1
  quality: stable
  extensions:
    - SonarSource.sonarlint-vscode
    - rust-lang.rust-analyzer
    - dbaeumer.vscode-eslint
    - esbenp.prettier-vscode
    - ms-azuretools.vscode-docker
    - redhat.vscode-xml
    - redhat.vscode-yaml
    - ms-vscode.cpptools
    - emeraldwalk.RunOnSave
    - ms-python.python
    - ms-toolsai.jupyter
    - vscjava.vscode-java-pack
    - ms-vscode-remote.vscode-remote-extensionpack
    - AykutSarac.jsoncrack-vscode
    - humao.rest-client
build:
  native:
    clang: latest
  python:
    - "3.12"
    - "3.13"
  java: "26"
  maven: "3.9"
  node: "24"
  npm: "12"
  rust:
    toolchain: nightly-2026-09-04
    components:
      - rust-src
      - rust-analyzer
      - rustfmt
      - clippy
utilities:
  curl: latest
  openssh-client: latest
  openssh-keygen: latest
  openssh-keyscan: latest
  unzip: latest
  zip: latest
  less: latest
  procps: latest
  findutils: latest
  kubectl: 1.37.0
  yq: "4"
  helm: "4"
  oras: "1"
  mongosh: "2"
  mongodbDatabaseTools: "100"
  clamav: "1.5"
