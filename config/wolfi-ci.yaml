    clang: latest
  python:
    - "3.12"
    - "3.13"
  java: "26"
  maven: "3.9"
  node: "24"
  npm: "12"
  rust:
    toolchain: nightly-2026-09-04
    components:
      - rust-src
      - rust-analyzer
      - rustfmt
      - clippy

# playwright: true

utilities:
