# yaml-language-server: $schema=./wolfi.schema.json
# One YAML produces one image. Select it with ./scripts/wolfi.sh COMMAND --config FILE.
# After edits run update-lock, then prefetch, build, test and scan. Locks are generated.
# Both examples have the same order: uncomment complete blocks and change selectors.
# Omitted components are disabled. APK selectors are literal versions/lines or latest;
# the resolver locks exact signed Wolfi packages and rejects unavailable selections.
# Use the reviewed utilities below (editor completion describes each package).
# image selects one output/platform; artifacts.root must be unique to this profile.
# user configures a named identity; devcontainer enables editor UID updates and init.
# docker.cli/buildx/compose are independent selectors; buildx requires cli.
# docker.socket requires cli, user and devcontainer; it enables the socket proxy.
# kaniko.version is exact; kaniko-build runs as root in a disposable CI job (README).
# vscode.version is required when enabled; extensions are optional, archived only.
# build.native enables C/C++ tools; clang is optional. Maven needs Java, npm needs Node.
# Rust requires a dated nightly; its components may be empty unless a VSIX needs them.
# playwright: true selects Chromium + headless shell for Playwright 1.63.0; requires
# Node and npm. Pin with playwright: {version: "1.63.0"}. Match the project version.
# Browser support is repository-tested on Wolfi. Screenshots/traces included; no video.
# Optional diagnostics add dependencies; scan every selected image. See README for
# CI identity, Kaniko isolation, browser limitations and the ClamAV remediation gate.
schemaVersion: 2

image:
  reference: devcontainers/wolfi-ci:0.1.0
  platform: linux/amd64

artifacts:
  root: artifacts/wolfi/ci

wolfi:
  baseImage: cgr.dev/chainguard/wolfi-base:latest
  repositories:
    main: https://apk.cgr.dev/chainguard
    extra: https://apk.cgr.dev/extra-packages

