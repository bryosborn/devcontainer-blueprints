# Include this file with explicit inputs from the application's GitLab pipeline.
# Select one approved digest for both inputs to reuse the Kaniko-enabled Wolfi CI
# image. Alternatively select an approved shell-capable dedicated Kaniko image.
# Kubernetes runner: UID 0 allowed, privileged=false, no Docker socket mount.
spec:
  inputs:
    ci-image:
      description: Approved Wolfi CI image containing the selected build tools
      regex: '^[a-z0-9][a-z0-9./:_-]*@sha256:[a-f0-9]{64}$'
    kaniko-image:
      description: Same Wolfi CI digest, or an approved shell-capable Kaniko image
      regex: '^[a-z0-9][a-z0-9./:_-]*@sha256:[a-f0-9]{64}$'
---
stages: [build, package]

compile-test:
  stage: build
  image:
    name: $[[ inputs.ci-image ]]
    entrypoint: [""]
  script:
    - ./ci/build-and-test.sh
  artifacts:
    paths: [dist/]
    expire_in: 1 day

container-image:
  stage: package
  image:
    name: $[[ inputs.kaniko-image ]]
    entrypoint: [""]
  needs:
    - job: compile-test
      artifacts: true
  script:
    - |
      set -eu
      umask 077
      mkdir -p /kaniko/.docker
      auth="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$auth" > /kaniko/.docker/config.json
      # Use this job's push credentials instead of inherited image-pull auth.
      unset DOCKER_AUTH_CONFIG
      export DOCKER_CONFIG=/kaniko/.docker
      if command -v kaniko-build >/dev/null 2>&1; then
        executor=kaniko-build
      else
        executor=/kaniko/executor
      fi
      "$executor" \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" \
        --digest-file "$CI_PROJECT_DIR/image-digest.txt"
  artifacts:
    paths: [image-digest.txt]
